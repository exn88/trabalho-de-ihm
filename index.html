<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nike Store</title>

  <link rel="stylesheet" href="css/style.css" />
  <script src="js/script.js" defer></script>
</head>

<body>
  <header class="header">
    <a href="#" class="logo">Nike</a>

    <nav class="navbar">
      <a href="#home">Home</a>
      <a href="#about">Sobre</a>
      <a href="#products">Produtos</a>
      <a href="#review">Avaliações</a>
      <a href="#contact">Contato</a>
    </nav>

    <div class="header-actions">
      <button class="cart-button">
        Carrinho <span class="cart-count">0</span>
      </button>

      <button class="menu-button" id="menu-button" aria-label="Abrir menu">
        ☰
      </button>
    </div>
  </header>

  <main>
    <section class="hero" id="home">
      <div class="hero-text">
        <p class="tag">Nova Coleção</p>
        <h1>Just do it</h1>
        <p class="description">
          Estilo, conforto e performance em uma experiência feita para quem vive em movimento.
        </p>
        <a href="#products" class="btn">Ver produtos</a>
      </div>

      <div class="hero-card">
        <img
          src="https://static.nike.com/a/images/t_PDP_1280_v1/f_auto,q_auto:eco/e7a7588b-6c71-4f39-a299-4f4367fc7355/air-max-plus-mens-shoes-nC0dzF.png"
          alt="Tênis Nike Air Max Plus"
        />
      </div>
    </section>

    <section class="products-section" id="products">
      <div class="section-title">
        <p>Produtos em destaque</p>
        <h2>Escolha seu Nike</h2>
      </div>
    </section>
  </main>
</body>
</html>
